Drop this into .github/workflows/release.yml. The only things you need to customise are the four env: values at the top:
Variable	Default	What it controls
APP_NAME	snipQ	Display name, artifact filenames
APP_BINARY	snipQ	The executable CMake produces
APP_ID	io.snipq.snipQ	Flatpak / AppStream reverse-DNS ID
PKG_NAME	snipq	Lowercase name used in .deb/.rpm/PKGBUILD

How each job works:

    DEB — runs on Ubuntu 24.04, calls cpack -G DEB (driven by the CPACK_DEBIAN_* variables already in your CMakeLists.txt)
    RPM — same but inside a fedora:40 container; calls cpack -G RPM
    Arch — spins up archlinux:latest, extracts the version from CMakeLists.txt, bundles a source tarball, patches PKGBUILD, and runs makepkg as a non-root builder user
    AppImage — installs linuxdeploy + the Qt plugin at runtime, stages an AppDir via cmake --install, then bundles everything including Qt libs
    Flatpak — installs flatpak-builder, pulls org.kde.Platform//6.9 from Flathub, builds using your packaging/io.snipq.snipQ.yml manifest, and exports a self-contained .flatpak bundle

On pushes/PRs to main/master all five jobs run as smoke tests. On a v* tag push, each job additionally attaches its artifact to the GitHub Release via softprops/action-gh-release.
