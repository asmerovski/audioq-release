name: Build and Test Qt6 CMake Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify (CachyOS Linux)
    runs-on: ubuntu-latest
    
    # Run the entire job inside the official CachyOS container
    container:
      image: cachyos/cachyos:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Pacman Keys and System Update
        run: |
          # Initialize pacman keyring inside the container
          pacman-key --init
          pacman-key --populate archlinux cachyos
          
          # Refresh databases and sync basic requirements
          pacman -Syu --noconfirm

      - name: Install Build Dependencies and Qt6
        run: |
          pacman -S --noconfirm --needed \
            base-devel \
            cmake \
            ninja \
            gcc \
            qt6-base \
            qt6-declarative \
            qt6-tools

      - name: Configure CMake
        run: |
          # Using Ninja for faster builds inside the pipeline
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --parallel $(nproc)

      - name: Run Tests
        run: |
          cd build && ctest --output-on-failure
