<svg width="512" height="512" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>AudioQ</title>
  <desc>AudioQ audio converter app icon</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171c2e"/>
      <stop offset="100%" stop-color="#0e1320"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="#2a6acc"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="#7eb8ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="none" stroke="#2a5298" stroke-width="2" opacity="0.5"/>

  <!-- Q arc (open at bottom-right) -->
  <path d="
    M 256 82
    A 174 174 0 1 1 382 382
  " fill="none" stroke="url(#arcGrad)" stroke-width="44" stroke-linecap="round"/>

  <!-- Q stem / tail -->
  <line x1="334" y1="334" x2="422" y2="422" stroke="url(#stemGrad)" stroke-width="44" stroke-linecap="round"/>

  <!-- Waveform bars inside the Q -->
  <rect x="166" y="238" width="18" height="50"  rx="9" fill="#2a6acc" opacity="0.85"/>
  <rect x="196" y="214" width="18" height="98"  rx="9" fill="#3b7de0" opacity="0.9"/>
  <rect x="226" y="196" width="18" height="134" rx="9" fill="#5b9cf6"/>
  <rect x="256" y="214" width="18" height="98"  rx="9" fill="#3b7de0" opacity="0.9"/>
  <rect x="286" y="238" width="18" height="50"  rx="9" fill="#2a6acc" opacity="0.85"/>
</svg>
